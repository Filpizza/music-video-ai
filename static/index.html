<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Music Video AI</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
    background: #14161a;
    color: #eee;
  }
  h1 { font-size: 22px; }
  h2 { font-size: 16px; margin-top: 28px; color: #ddd; }
  .mode-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 20px;
  }
  .mode-dry_run { background: #1f7a3f; color: white; }
  .mode-production { background: #a12b2b; color: white; }
  label { display: block; margin-top: 16px; margin-bottom: 6px; font-size: 14px; color: #bbb; }
  textarea, select, input[type=text] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1e2126;
    color: #eee;
    font-size: 14px;
  }
  textarea { resize: vertical; min-height: 70px; }
  .hints-row { display: flex; gap: 12px; }
  .hints-row > div { flex: 1; }
  .checkbox-row {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #bbb;
  }
  .checkbox-row input { width: auto; }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #3d7cf4;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
  button.secondary { background: #2a2d33; }
  button:disabled { background: #555; cursor: not-allowed; }
  #progress-wrap { margin-top: 24px; display: none; }
  #progress-bar-bg { background: #2a2d33; border-radius: 8px; overflow: hidden; height: 22px; }
  #progress-bar { height: 100%; width: 0%; background: #3d7cf4; transition: width 0.3s ease; }
  #progress-step { margin-top: 8px; font-size: 14px; color: #bbb; }
  #error-box {
    display: none;
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    background: #3a1d1d;
    color: #ff9d9d;
    font-size: 14px;
  }
  #preview-box, #result-box { display: none; margin-top: 20px; }
  video { width: 100%; border-radius: 8px; margin-top: 10px; }
  .card {
    background: #1e2126;
    border: 1px solid #2c2f36;
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.5;
  }
  .card .row { margin-bottom: 6px; }
  .card .row b { color: #9db8ff; }
  .tag {
    display: inline-block;
    background: #2a2d33;
    border-radius: 6px;
    padding: 2px 8px;
    margin: 2px 4px 2px 0;
    font-size: 12px;
    color: #ddd;
  }
  .neg-tag { background: #3a1d1d; color: #ff9d9d; }
</style>
</head>
<body>
  <h1>🎬 Music Video AI</h1>
  <span id="mode-badge" class="mode-badge">...</span>
  <span id="image-badge" class="mode-badge" style="display:none;"></span>

  <label for="prompt">Идея клипа (любой жанр — techno, phonk, lo-fi, оркестр, баллада...)</label>
  <textarea id="prompt" placeholder="Например: агрессивный phonk про ночной город"></textarea>

  <div class="hints-row">
    <div>
      <label for="mood-hint">Настроение (необязательно)</label>
      <input type="text" id="mood-hint" placeholder="Gemini решит сам">
    </div>
    <div>
      <label for="bpm-hint">BPM (необязательно)</label>
      <input type="text" id="bpm-hint" placeholder="Gemini решит сам">
    </div>
  </div>
  <label for="palette-hint">Цветовая гамма клипа (необязательно)</label>
  <input type="text" id="palette-hint" placeholder="Gemini решит сам">

  <label for="style-hint">Стиль / Герой — «визуальная ДНК» (необязательно)</label>
  <textarea id="style-hint" placeholder="Напр.: киборг-разработчик, хромированная броня, неоновая лаборатория. Оставь пустым — Gemini предложит черновик, ты потом поправишь. Этот стиль держится во всех сценах."></textarea>

  <label for="duration">Длительность ролика</label>
  <select id="duration"></select>

  <div class="checkbox-row">
    <input type="checkbox" id="auto-mode">
    <label for="auto-mode" style="margin:0;">Полный автомат (пропустить предпросмотр промптов)</label>
  </div>

  <button id="start-btn" onclick="onStartClick()">Показать промпты</button>

  <div id="preview-box"></div>

  <div id="progress-wrap">
    <div id="progress-bar-bg"><div id="progress-bar"></div></div>
    <div id="progress-step">...</div>
  </div>

  <div id="error-box"></div>

  <div id="result-box">
    <strong id="result-title"></strong>
    <video id="result-video" controls></video>
  </div>

<script>
let polling = null;
let cfg = null;

async function loadConfig() {
  let res;
  try {
    res = await fetch("/api/config");
    if (!res.ok) throw new Error("HTTP " + res.status);
    cfg = await res.json();
  } catch (e) {
    showError("Не удалось загрузить настройки с сервера. Обнови страницу (Ctrl+Shift+R). " + e);
    return;
  }

  const badge = document.getElementById("mode-badge");
  badge.textContent = cfg.mode === "dry_run" ? "DRY RUN — бесплатно" : "PRODUCTION — тратит деньги";
  badge.className = "mode-badge mode-" + cfg.mode;

  // Картинки выбираются отдельно от режима — показываем платный статус явно
  const imgBadge = document.getElementById("image-badge");
  if (cfg.image_provider && cfg.image_provider !== "stub") {
    const price = (cfg.image_price_usd || 0).toFixed(2);
    imgBadge.textContent = `🖼️ Картинки: ${cfg.image_provider.toUpperCase()} — ПЛАТНО ~$${price}/шт (лимит ${cfg.max_images_per_run})`;
    imgBadge.className = "mode-badge mode-production";
    imgBadge.style.display = "inline-block";
  } else {
    imgBadge.style.display = "none";
  }

  const durationSelect = document.getElementById("duration");
  cfg.duration_options.forEach(numScenes => {
    const seconds = numScenes * cfg.clip_duration;
    const opt = document.createElement("option");
    opt.value = numScenes;
    opt.textContent = `${seconds} сек (${numScenes} сцен)`;
    durationSelect.appendChild(opt);
  });

  document.getElementById("auto-mode").checked = !!cfg.auto_mode_default;
  updateButtonLabel();
}

function updateButtonLabel() {
  const auto = document.getElementById("auto-mode").checked;
  document.getElementById("start-btn").textContent = auto ? "Создать клип" : "Показать промпты";
}
document.getElementById("auto-mode").addEventListener("change", updateButtonLabel);

function collectRequestBody() {
  return {
    prompt: document.getElementById("prompt").value,
    num_scenes: parseInt(document.getElementById("duration").value, 10),
    mood_hint: document.getElementById("mood-hint").value,
    bpm_hint: document.getElementById("bpm-hint").value,
    palette_hint: document.getElementById("palette-hint").value,
    style_hint: document.getElementById("style-hint").value,
  };
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function resetPanels() {
  document.getElementById("error-box").style.display = "none";
  document.getElementById("result-box").style.display = "none";
  document.getElementById("preview-box").style.display = "none";
  document.getElementById("preview-box").innerHTML = "";
}

async function onStartClick() {
  resetPanels();
  const auto = document.getElementById("auto-mode").checked;
  if (auto) {
    await startAuto();
  } else {
    await startPreview();
  }
}

async function startPreview() {
  const btn = document.getElementById("start-btn");
  btn.disabled = true;
  btn.textContent = "Генерирую промпты... (10-20 сек)";

  try {
    const res = await fetch("/api/preview", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(collectRequestBody()),
    });
    if (!res.ok) {
      const err = await res.json();
      showError(err.detail || "Не удалось сгенерировать промпты");
      return;
    }
    const preview = await res.json();
    renderPreview(preview);
  } finally {
    btn.disabled = false;
    updateButtonLabel();
  }
}

function renderPreview(preview) {
  const m = preview.music;
  const instruments = (m.key_instruments || []).map(t => `<span class="tag">${t}</span>`).join("");
  const negTags = (m.negative_tags || []).map(t => `<span class="tag neg-tag">${t}</span>`).join("");

  let html = `
    <h2>🎵 Музыкальный бриф</h2>
    <div class="card">
      <div class="row"><b>Жанр:</b> ${m.genre} / ${m.sub_genre}</div>
      <div class="row"><b>BPM:</b> ${m.bpm} &nbsp; <b>Настроение:</b> ${m.mood}</div>
      <div class="row"><b>Вокал:</b> ${m.vocal_type}</div>
      <div class="row"><b>Инструменты:</b><br>${instruments}</div>
      ${negTags ? `<div class="row"><b>Не должно быть:</b><br>${negTags}</div>` : ""}
      <div class="row"><b>Промпт музыки</b> <span style="color:#9aa;font-size:12px;">(можно править)</span></div>
      <textarea id="edit-music-prompt">${escapeHtml(preview.music_prompt || m.suno_prompt)}</textarea>
    </div>

    <h2>🎭 Стиль / Герой</h2>
    <div class="card">
      <div class="row" style="color:#9aa; font-size:13px;">Этот текст принудительно добавляется в КАЖДЫЙ кадр — правишь тут, меняется весь ролик.</div>
      <textarea id="edit-style">${escapeHtml(preview.style)}</textarea>
    </div>

    <h2>🎨 Цветовая гамма клипа</h2>
    <div class="card">
      <textarea id="edit-color-palette">${escapeHtml(preview.color_palette)}</textarea>
    </div>

    <h2>🎬 Сцены (${preview.scenes.length}) <span style="color:#9aa;font-size:13px;">— можно править</span></h2>
  `;

  preview.scenes.forEach(scene => {
    const sceneNeg = (scene.negative_tags || []).map(t => `<span class="tag neg-tag">${t}</span>`).join("");
    html += `
      <div class="card">
        <div class="row"><b>Сцена ${scene.id}</b> — ${escapeHtml(scene.mood)}</div>
        <div class="row" style="color:#9aa; font-size:13px;">${escapeHtml(scene.description)}</div>
        <div class="row"><b>Что в кадре</b> <span style="color:#9aa;font-size:12px;">(картинка)</span></div>
        <textarea id="edit-image-${scene.id}">${escapeHtml(scene.image_prompt)}</textarea>
        <div class="row"><b>Движение камеры</b> <span style="color:#9aa;font-size:12px;">(видео, для Veo)</span></div>
        <textarea id="edit-motion-${scene.id}">${escapeHtml(scene.motion_prompt)}</textarea>
        ${sceneNeg ? `<div class="row">${sceneNeg}</div>` : ""}
      </div>
    `;
  });

  html += `<button onclick="confirmGenerate('${preview.preview_id}')">Создать клип</button>`;

  const box = document.getElementById("preview-box");
  box.innerHTML = html;
  box.style.display = "block";

  // Запоминаем id сцен, чтобы собрать правки при подтверждении
  window._sceneIds = preview.scenes.map(s => s.id);
}

async function confirmGenerate(previewId) {
  // Собираем отредактированные пользователем поля
  const sceneIds = window._sceneIds || [];
  const scenes = sceneIds.map(id => ({
    id: id,
    image_prompt: (document.getElementById("edit-image-" + id) || {}).value || "",
    motion_prompt: (document.getElementById("edit-motion-" + id) || {}).value || "",
  }));
  const body = {
    preview_id: previewId,
    music_prompt: (document.getElementById("edit-music-prompt") || {}).value || "",
    style: (document.getElementById("edit-style") || {}).value || "",
    color_palette: (document.getElementById("edit-color-palette") || {}).value || "",
    scenes: scenes,
  };

  const res = await fetch("/api/confirm", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json();
    showError(err.detail || "Не удалось запустить генерацию");
    return;
  }
  document.getElementById("start-btn").disabled = true;
  document.getElementById("progress-wrap").style.display = "block";
  polling = setInterval(pollStatus, 1000);
}

async function startAuto() {
  const res = await fetch("/api/generate_auto", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(collectRequestBody()),
  });
  if (!res.ok) {
    const err = await res.json();
    showError(err.detail || "Не удалось запустить генерацию");
    return;
  }
  document.getElementById("start-btn").disabled = true;
  document.getElementById("progress-wrap").style.display = "block";
  polling = setInterval(pollStatus, 1000);
}

async function pollStatus() {
  const res = await fetch("/api/status");
  const status = await res.json();

  document.getElementById("progress-bar").style.width = (status.percent || 0) + "%";
  document.getElementById("progress-step").textContent = status.step || "";

  if (status.status === "done") {
    clearInterval(polling);
    document.getElementById("start-btn").disabled = false;
    document.getElementById("result-title").textContent = "Готово: " + status.title;
    document.getElementById("result-video").src = "/api/video?" + Date.now();
    document.getElementById("result-box").style.display = "block";
  } else if (status.status === "error") {
    clearInterval(polling);
    document.getElementById("start-btn").disabled = false;
    showError(status.error || "Произошла ошибка");
  }
}

function showError(message) {
  const box = document.getElementById("error-box");
  box.textContent = "Ошибка: " + message;
  box.style.display = "block";
}

loadConfig();
</script>
</body>
</html>
